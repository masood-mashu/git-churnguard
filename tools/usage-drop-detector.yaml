name: usage-drop-detector
version: 1.0.0
description: "Calculates percentage drop in weekly active users compared to previous 30-day baseline"
input_schema:
  type: object
  properties:
    usage_data_json:
      type: string
      description: "JSON string with baseline_wau and current_wau"
  required:
    - usage_data_json
implementation:
  type: script
  path: usage_drop_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
